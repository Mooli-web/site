{% load static %}
<div id="consultation-form" class="text-center py-8 anim-up">
  <div class="mx-auto inline-flex w-16 h-16 items-center justify-center rounded-full bg-green-100 text-green-600">
    <svg class="w-9 h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
  </div>
  <h3 class="mt-5 text-xl font-bold text-gray-800">درخواست شما ثبت شد</h3>
  <p class="mt-3 text-gray-600 leading-7">
    {{ name }} عزیز، از شما سپاسگزاریم. درخواست مشاوره‌ی رایگان شما با موفقیت ثبت شد و
    کارشناسان ما به‌زودی با شما تماس خواهند گرفت.
  </p>
  <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
    <a href="{% url 'website:home' %}"
       class="inline-flex items-center justify-center gap-2 rounded-full bg-blush-600 px-6 py-3 text-sm font-bold text-white shadow-soft hover:bg-blush-700 transition">
      بازگشت به خانه
    </a>
    <a href="{% url 'website:booking' %}"
       class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-6 py-3 text-sm font-bold text-blush-700 ring-1 ring-blush-200 hover:bg-blush-50 transition">
      رزرو نوبت
    </a>
  </div>
</div>
