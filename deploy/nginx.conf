# ============================================================================ #
#  پیکربندی نمونه‌ی Nginx برای «کلینیک زیبایی» (Django + Gunicorn)
#
#  جای‌گذاری:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/beauty-clinic
#    sudo ln -s /etc/nginx/sites-available/beauty-clinic /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  گواهی TLS: با certbot رایگان دریافت می‌شود:
#    sudo certbot --nginx -d clinic.example.com -d www.clinic.example.com
# ============================================================================ #

# آپ‌استریم به سوکت یونیکس Gunicorn
upstream beauty_clinic_app {
    server unix:/run/beauty-clinic/gunicorn.sock fail_timeout=0;
}

# --- هدایت HTTP به HTTPS ----------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.com www.clinic.example.com;

    # مسیر چالش certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- سرور اصلی HTTPS --------------------------------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clinic.example.com www.clinic.example.com;

    # ---- گواهی TLS (با certbot پر می‌شود) ----
    ssl_certificate     /etc/letsencrypt/live/clinic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # حداکثر حجم بدنه‌ی درخواست (آپلود)
    client_max_body_size 10M;

    # فشرده‌سازی
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ---- فایل‌های static (هش‌گذاری‌شده توسط WhiteNoise/collectstatic) ----
    # WhiteNoise هم می‌تواند static را سرو کند، اما سرو مستقیم با nginx سریع‌تر است.
    location /static/ {
        alias /home/user/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- فایل‌های آپلودی (media) ----
    location /media/ {
        alias /home/user/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- پروکسی به Gunicorn ----
    location / {
        proxy_pass http://beauty_clinic_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # حیاتی: Django با این هدر تشخیص می‌دهد که اتصال امن (HTTPS) است.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
